name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -oq AnimalFriend.zip
      - name: Add Three.js (offline bundle)
        run: |
          npm install three@0.150.1 --prefix /tmp/t
          cp /tmp/t/node_modules/three/build/three.min.js app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Animal Friend APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
